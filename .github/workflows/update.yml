name: 뉴스 업데이트

on:
  schedule:
    - cron: "0 */2 * * *" # 2시간마다
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["public/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 뉴스 수집·요약
        run: npm run update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
      - name: 데이터 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "뉴스 업데이트 $(date -u +%FT%TZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
